version: "3.9"

services:
  ts6viewer:
    # Use this if you built the image locally via:
    # docker build -t ts6viewer:main .
    # image: ts6viewer:main
    # Use this if you want to pull the prebuilt image from Docker Hub
    image: maxallica/ts6-viewer:latest
    container_name: ts6viewer
    ports:
      - "9000:8080"

    environment:
      SERVER_PORT: "8080"
      REFRESH_INTERVAL: "60"
      HOST_CONNECTION_LINK: ""

      HOST: "192.168.178.2"
      PORT: "10022"
      USER: "serveradmin"
      PASSWORD: ""
      ENABLE_VOICE_STATUS: "true"
      SERVER_ID: "1"

      # Statistics panel (all optional, these are the defaults)
      # STATS_GRAPH: "true"                # show the Online Clients graph
      # STATS_GRAPH_MAX_RANGE: "1m"       # 24h | 7d | 14d | 1m (also sets history retention)
      # STATS_RECENT_ACTIVITY: "true"      # show the Recent Activity list
      # STATS_RECENT_ACTIVITY_LIMIT: "10"  # entries to show, 0 = unlimited

      # Persisted statistics state (recent activity + graph history)
      # lives on a volume so it survives container recreation.
      STATE_FILE: "/data/state.json"

    volumes:
      - ts6viewer-data:/data

    restart: unless-stopped

volumes:
  ts6viewer-data:
