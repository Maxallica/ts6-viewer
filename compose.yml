version: "3.9"

services:
  ts6viewer:
    # Use this if you built the image locally via:
    # docker build -t ts6viewer:main .
    # image: ts6viewer:main
    # Use this if you want to pull the prebuilt image from Docker Hub
    image: maxallica/ts6-viewer:latest
    container_name: ts6viewer
    ports:
      - "9000:8080"

    environment:
      SERVER_PORT: "8080"
      REFRESH_INTERVAL: "60"
      HOST_CONNECTION_LINK: ""

      HOST: "192.168.178.2"
      PORT: "10022"
      USER: "serveradmin"
      PASSWORD: ""
      ENABLE_VOICE_STATUS: "true"
      SERVER_ID: "1"

      # Persisted statistics state (recent activity + 24h history)
      # lives on a volume so it survives container recreation.
      STATE_FILE: "/data/state.json"

    volumes:
      - ts6viewer-data:/data

    restart: unless-stopped

volumes:
  ts6viewer-data:
